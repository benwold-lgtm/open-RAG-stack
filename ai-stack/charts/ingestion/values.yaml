image:
  repository: ghcr.io/benwold-lgtm/open-rag-ingestion
  tag: latest  # built by CI from this repo — pin to a specific tag for production
  pullPolicy: Always

replicaCount: 1
revisionHistoryLimit: 3

service:
  type: NodePort
  port: 8002
  nodePort: 30083

# Holds the shared SERVICE_TOKEN. bootstrap.sh creates this secret; the same token value
# goes into the ai-agent / chat-ui / rag-admin secrets so the whole data plane agrees.
secretName: ingestion-secrets

qdrant:
  url: "http://qdrant.qdrant.svc.cluster.local:6333"
  secretName: qdrant-secrets

embedding:
  url: "http://embedding.embedding.svc.cluster.local:8001"

config:
  # ── Data-plane auth ─────────────────────────────────────────────────────────
  # This service VERIFIES the shared SERVICE_TOKEN on every data route (the page-image
  # route and /health stay open).
  production: true        # ENVIRONMENT=production → fail closed if no token and not anonymous
  allowAnonymous: false   # true = allow unauthenticated access on a trusted, isolated LAN
  chunkSize: "256"      # Phase 6: 256 validated best (page-level hit@5 0.820 vs 0.770 at 512)
  chunkOverlap: "64"
  embeddingDim: "768"
  # OCR fallback for image-rich PDF pages (Tesseract, CPU-only). Only fires on
  # pages whose text layer is shorter than ocrMinChars.
  ocrEnabled: "true"
  ocrMinChars: "100"
  ocrDpi: "200"

storage:
  size: 5Gi
  storageClassName: "local-path"

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "6Gi"
    cpu: "2000m"
watchDir:
  enabled: false
  hostPath: ""          # path on the node to watch, e.g. /mnt/your-share/rag-watch
  mountPath: /mnt/watch
  pollInterval: "60"

# ── Document store ─────────────────────────────────────────────────────────────
# When enabled, ingestion saves each original upload as <store>/<vendor>/<filename> and
# serves it at /documents/{id}/file so chat citations link to the source. Prefer an NFS
# share (shared, browsable, survives the pod); falls back to a node hostPath if nfs.server
# is empty. The page-image citations also read from here.
docStore:
  enabled: false
  mountPath: /mnt/docstore   # where it mounts in the container (and the DOC_STORE value)
  nfs:
    server: ""               # e.g. 192.168.x.x — set to use an NFS share
    path: ""                 # e.g. /export/rag-docs
  hostPath: ""               # node path, used only when nfs.server is empty

podSecurityContext:
  fsGroup: 1000  # ensures the PVC at /app/data is writable by UID 1000

# ── Network isolation ─────────────────────────────────────────────────────────
# Restrict ingress to ingestion to ai-agent + rag-admin. Default off so the first deploy
# works on any CNI; turn on only with Calico/Cilium (flannel does not enforce it). When on,
# the NodePort path (page images, helper scripts) is blocked — see networkpolicy.yaml.
networkPolicy:
  enabled: false

nodeSelector:
  kubernetes.io/hostname: <your-node-name>

# Note: the ingestion service requires no model storage as of Phase 4c — PDF
# parsing uses PyMuPDF (bundled) and OCR uses Tesseract (apt package). The
# former Docling modelStorage / DOCLING_ARTIFACTS_PATH wiring has been removed.