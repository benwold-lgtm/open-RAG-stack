{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress for qdrant, then allow only its known in-cluster callers.
# Disabled by default (networkPolicy.enabled=false) so a first deploy can't be broken
# by a CNI that enforces policy. ONLY effective on a CNI that enforces NetworkPolicy
# (Calico / Cilium). flannel ignores it — see the README "Network isolation" note.
# Caller namespaces are matched by the kubernetes.io/metadata.name label that
# Kubernetes (>=1.21) sets automatically on every namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-allow
  namespace: qdrant
spec:
  podSelector:
    matchLabels:
      app: qdrant
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-agent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingestion
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
{{- end }}
