image:
  repository: qdrant/qdrant
  tag: v1.9.0
  pullPolicy: IfNotPresent

replicaCount: 1
revisionHistoryLimit: 3

service:
  type: NodePort
  port: 6333           # REST API
  grpcPort: 6334       # gRPC API
  nodePort: 30333      # external REST access
  grpcNodePort: 30334  # external gRPC access

storage:
  size: 50Gi
  storageClassName: "local-path"  # adjust to match your storageclass

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

# API key for securing Qdrant
security:
  apiKey: ""  # leave blank, we use k8s secret
  secretName: qdrant-secrets

# ── Network isolation ─────────────────────────────────────────────────────────
# Restrict ingress to qdrant to its in-cluster callers (ai-agent, ingestion). Default
# off so the first deploy works on any CNI; turn on only with Calico/Cilium. flannel
# does NOT enforce NetworkPolicy — see the README "Network isolation" section.
networkPolicy:
  enabled: false

nodeSelector:
  kubernetes.io/hostname: <your-node-name>