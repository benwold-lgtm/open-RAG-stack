apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-admin
  namespace: rag-admin
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: rag-admin
  template:
    metadata:
      labels:
        app: rag-admin
    spec:
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: rag-admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8005
          env:
            - name: INGESTION_URL
              value: {{ .Values.ingestion.url | quote }}
            # Shared data-plane token forwarded to ingestion. optional:true so open deploys boot.
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.serviceToken.secretName }}
                  key: SERVICE_TOKEN
                  optional: true
            {{- if .Values.auth.enabled }}
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: ADMIN_PASSWORD
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}
