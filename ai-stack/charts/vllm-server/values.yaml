replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: vllm/vllm-openai
  tag: v0.9.2  # CUDA 12.8 — upgrade to v0.20.0+ only if your node has CUDA 13.0 drivers
  pullPolicy: IfNotPresent

model:
  name: ""            # Required: HuggingFace model ID, e.g. "mistralai/Mistral-7B-Instruct-v0.3"
  downloadDir: "/data"

server:
  maxModelLen: 8192
  gpuMemoryUtilization: "0.90"
  maxNumSeqs: 4
  maxNumBatchedTokens: 8192
  extraArgs: []       # additional vLLM flags, e.g. ["--dtype", "float16"]

resources:
  limits:
    cpu: "8"
    memory: "32Gi"
    nvidia.com/gpu: 1
  requests:
    cpu: "4"
    memory: "16Gi"
    nvidia.com/gpu: 1

nodeSelector:
  kubernetes.io/hostname: <your-node-name>

service:
  type: NodePort
  port: 8000
  nodePort: 30000

persistence:
  size: 500Gi
  storageClassName: "local-path"
  pvcName: vllm-models-pvc

shm:
  sizeLimit: 16Gi

env:
  extra: []  # model-specific env vars, e.g. [{name: VLLM_ALLOW_LONG_MAX_MODEL_LEN, value: "1"}]

# ── Qwen3 advanced patches ──────────────────────────────────────────────────
# Only set enabled: true if you are running Qwen3 on a single RTX 3090 and
# need the Genesis memory patches + MTP speculative decoding.
# Leave disabled for all other models (Mistral, Llama, Gemma, Phi, Qwen2, etc.)
patches:
  enabled: false
  genesisRepo: "https://github.com/Sandermage/genesis-vllm-patches.git"
  recipeRepo: "https://github.com/noonghunna/qwen36-27b-single-3090.git"
  # Pin to the Genesis-v7.14-compatible nightly — clear if floating on :latest again
  imageDigest: "sha256:9bba4628a3b943e0dd33caefb94b811569ba1e97bdf23bee19a265c31b947ccb"
  quantization: "auto_round"
  dtype: "float16"
  kvCacheDtype: "fp8_e5m2"
  reasoningParser: "qwen3"
  toolCallParser: "qwen3_coder"
  speculativeConfig: '{"method":"mtp","num_speculative_tokens":3}'
