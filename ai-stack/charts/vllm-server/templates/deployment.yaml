apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      hostIPC: true
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "sku"
          operator: "Equal"
          value: "gpu"
          effect: "NoSchedule"
      {{- if .Values.patches.enabled }}
      initContainers:
        - name: fetch-patches
          image: alpine/git:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              git clone --depth 1 {{ .Values.patches.genesisRepo }} /patches/genesis
              git clone --depth 1 {{ .Values.patches.recipeRepo }} /tmp/recipe
              cp /tmp/recipe/patches/patch_tolist_cudagraph.py /patches/
          volumeMounts:
            - name: patches
              mountPath: /patches
      {{- end }}
      containers:
        - name: vllm-container
          {{- if .Values.patches.enabled }}
          image: "{{ .Values.image.repository }}@{{ .Values.patches.imageDigest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          {{- if .Values.patches.enabled }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              pip install xxhash -q
              VLLM_PATH=$(python3 -c "import vllm, os; print(os.path.dirname(vllm.__file__))")
              cp -r /patches/genesis/vllm/_genesis "${VLLM_PATH}/_genesis"
              python3 -m vllm._genesis.patches.apply_all
              python3 /patches/patch_tolist_cudagraph.py
              exec python3 -m vllm.entrypoints.openai.api_server \
                --model {{ .Values.model.name }} \
                --download-dir {{ if .Values.modelStorage.enabled }}{{ .Values.modelStorage.mountPath }}/huggingface{{ else }}{{ .Values.model.downloadDir }}{{ end }} \
                --quantization {{ .Values.patches.quantization }} \
                --dtype {{ .Values.patches.dtype }} \
                --tensor-parallel-size 1 \
                --max-model-len {{ .Values.server.maxModelLen }} \
                --gpu-memory-utilization {{ .Values.server.gpuMemoryUtilization }} \
                --max-num-seqs {{ .Values.server.maxNumSeqs }} \
                --max-num-batched-tokens {{ .Values.server.maxNumBatchedTokens }} \
                --kv-cache-dtype {{ .Values.patches.kvCacheDtype }} \
                --trust-remote-code \
                --reasoning-parser {{ .Values.patches.reasoningParser }} \
                --enable-auto-tool-choice \
                --tool-call-parser {{ .Values.patches.toolCallParser }} \
                --enable-prefix-caching \
                --enable-chunked-prefill \
                --no-scheduler-reserve-full-isl \
                --speculative-config '{{ .Values.patches.speculativeConfig }}' \
                --host 0.0.0.0 \
                --port {{ .Values.service.port }}
          {{- else }}
          command: ["python3"]
          args:
            - -m
            - vllm.entrypoints.openai.api_server
            - --model
            - {{ .Values.model.name | quote }}
            - --download-dir
            - {{ if .Values.modelStorage.enabled }}{{ printf "%s/huggingface" .Values.modelStorage.mountPath | quote }}{{ else }}{{ .Values.model.downloadDir | quote }}{{ end }}
            - --max-model-len
            - {{ .Values.server.maxModelLen | quote }}
            - --gpu-memory-utilization
            - {{ .Values.server.gpuMemoryUtilization | quote }}
            - --max-num-seqs
            - {{ .Values.server.maxNumSeqs | quote }}
            - --max-num-batched-tokens
            - {{ .Values.server.maxNumBatchedTokens | quote }}
            - --tensor-parallel-size
            - "1"
            - --trust-remote-code
            - --enable-prefix-caching
            - --enable-chunked-prefill
            {{- range .Values.server.extraArgs }}
            - {{ . | quote }}
            {{- end }}
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.service.port | quote }}
          {{- end }}
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            {{- if .Values.modelStorage.enabled }}
            - name: HF_HOME
              value: "{{ .Values.modelStorage.mountPath }}/huggingface"
            {{- end }}
            {{- range .Values.env.extra }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: data-vol
              mountPath: {{ .Values.model.downloadDir }}
            - name: shm
              mountPath: /dev/shm
            {{- if .Values.patches.enabled }}
            - name: patches
              mountPath: /patches
            {{- end }}
            {{- if .Values.modelStorage.enabled }}
            - name: model-storage
              mountPath: {{ .Values.modelStorage.mountPath }}
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data-vol
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.pvcName }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shm.sizeLimit }}
        {{- if .Values.patches.enabled }}
        - name: patches
          emptyDir: {}
        {{- end }}
        {{- if .Values.modelStorage.enabled }}
        - name: model-storage
          persistentVolumeClaim:
            claimName: {{ .Values.modelStorage.pvcName }}
            readOnly: true
        {{- end }}
