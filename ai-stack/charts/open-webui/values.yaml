image:
  repository: ghcr.io/open-webui/open-webui
  tag: v0.9.6
  pullPolicy: IfNotPresent

replicaCount: 1
revisionHistoryLimit: 3

service:
  type: NodePort
  port: 8080
  nodePort: 30080

vllm:
  baseUrl: "http://ai-agent.ai-agent.svc.cluster.local:8000/v1"   # update if routing through NodePort instead of cluster DNS
  apiKey: "not-needed"

auth:
  enabled: true    # disable only on a fully trusted, isolated network

storage:
  size: 5Gi
  storageClassName: "local-path"
nodeSelector:
  kubernetes.io/hostname: <your-node-name>