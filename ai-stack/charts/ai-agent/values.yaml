image:
  repository: ghcr.io/benwold-lgtm/open-rag-ai-agent
  tag: latest  # built by CI from this repo — pin to a specific tag for production
  pullPolicy: Always

replicaCount: 1
revisionHistoryLimit: 3

service:
  type: NodePort      # internal only, the chat UI talks to it inside the cluster
  port: 8000
  nodePort: 30081    # expose on this port on each node

vllm:
  # Any OpenAI-compatible endpoint: the bundled vllm-server (http://<gpu-node-ip>:30000/v1),
  # or a remote/hosted one. See README "Choosing a model". For a hosted endpoint that
  # requires auth, add a VLLM_API_KEY key to the ai-agent-secrets secret.
  baseUrl: ""          # e.g. http://<gpu-node-ip>:30000/v1
  model: ""            # model ID served by that endpoint (HF model ID for local vLLM)

# Holds the shared SERVICE_TOKEN (and the QDRANT_API_KEY / web-search keys). bootstrap.sh
# writes SERVICE_TOKEN here; the same value goes into ingestion / chat-ui / rag-admin secrets.
secretName: ai-agent-secrets

# ── Data-plane auth ───────────────────────────────────────────────────────────
# This service VERIFIES the shared SERVICE_TOKEN on /v1/chat/completions and /v1/models.
config:
  production: true        # ENVIRONMENT=production → fail closed if no token and not anonymous
  allowAnonymous: false   # true = allow unauthenticated access on a trusted, isolated LAN

qdrant:
  url: "http://qdrant.qdrant.svc.cluster.local:6333"
  secretName: ai-agent-secrets

embedding:
  url: "http://embedding.embedding.svc.cluster.local:8001"

ingestion:
  url: "http://ingestion.ingestion.svc.cluster.local:8002"
  # Browser-reachable base for inline page-image citations (e.g. http://<node-ip>:30083).
  # Empty = text-only page citations. Must be reachable from the user's browser.
  publicUrl: ""

# Verified citations: model emits verbatim quotes; agent checks them against the
# retrieved chunks and flags unverified ones. Set false to disable.
citeVerify: "true"

# Query rewriting before retrieval. Off by default — Phase 5 found it net-negative
# for dense retrieval with nomic. Set "true" to re-enable.
queryRewrite: "false"

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

nodeSelector:
  kubernetes.io/hostname: <your-node-name>

# ── Web Search ───────────────────────────────────────────────────────────────
# provider: one of  searxng | brave | serper | tavily | none
#
# searxng  — self-hosted, no API key needed. Deploy ai-stack/charts/searxng
#            first, then set provider: searxng here.
# brave    — Brave Search API. Create a K8s secret with key BRAVE_API_KEY.
# serper   — Serper (Google) API. Create a K8s secret with key SERPER_API_KEY.
# tavily   — Tavily API. Create a K8s secret with key TAVILY_API_KEY.
# none     — web search disabled (RAG-only mode). No secret required.
#
# For external providers, create the secret before deploying:
#   kubectl create secret generic ai-agent-secrets -n ai-agent \
#     --from-literal=BRAVE_API_KEY=<key> \
#     --from-literal=QDRANT_API_KEY=<key>
webSearch:
  provider: "none"
  searxngUrl: "http://searxng.searxng.svc.cluster.local:8080"
  secretName: "ai-agent-secrets"  # K8s secret containing the provider API key

# ── Reranker ─────────────────────────────────────────────────────────────────
# The reranker chart is deployed by deploy/install.sh, so this points at it by
# default. Set url to "" to disable reranking (top-5 by vector score instead).
reranker:
  url: "http://reranker.reranker.svc.cluster.local:8003"

# ── Network isolation ─────────────────────────────────────────────────────────
# Restrict ingress to ai-agent to chat-ui only. Default off so the first deploy works
# on any CNI; turn on only with Calico/Cilium (flannel does not enforce NetworkPolicy).
# When on, the NodePort path is blocked too — see the chart's networkpolicy.yaml note.
networkPolicy:
  enabled: false