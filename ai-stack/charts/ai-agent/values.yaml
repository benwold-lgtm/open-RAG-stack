image:
  repository: ghcr.io/benwold-lgtm/open-rag-ai-agent
  tag: latest  # built by CI from this repo — pin to a specific tag for production
  pullPolicy: Always

replicaCount: 1
revisionHistoryLimit: 3

service:
  type: NodePort      # internal only, Open-WebUI talks to it inside the cluster
  port: 8000
  nodePort: 30081    # expose on this port on each node

vllm:
  baseUrl: ""          # e.g. http://<gpu-node-ip>:30000/v1
  model: ""            # HuggingFace model ID loaded by vllm-server

qdrant:
  url: "http://qdrant.qdrant.svc.cluster.local:6333"
  secretName: ai-agent-secrets

embedding:
  url: "http://embedding.embedding.svc.cluster.local:8001"

ingestion:
  url: "http://ingestion.ingestion.svc.cluster.local:8002"
  # Browser-reachable base for inline page-image citations (e.g. http://<node-ip>:30083).
  # Empty = text-only page citations. Must be reachable from the user's browser.
  publicUrl: ""

# Verified citations: model emits verbatim quotes; agent checks them against the
# retrieved chunks and flags unverified ones. Set false to disable.
citeVerify: "true"

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

nodeSelector:
  kubernetes.io/hostname: <your-node-name>

# ── Web Search ───────────────────────────────────────────────────────────────
# provider: one of  searxng | brave | serper | tavily | none
#
# searxng  — self-hosted, no API key needed. Deploy ai-stack/charts/searxng
#            first, then set provider: searxng here.
# brave    — Brave Search API. Create a K8s secret with key BRAVE_API_KEY.
# serper   — Serper (Google) API. Create a K8s secret with key SERPER_API_KEY.
# tavily   — Tavily API. Create a K8s secret with key TAVILY_API_KEY.
# none     — web search disabled (RAG-only mode). No secret required.
#
# For external providers, create the secret before deploying:
#   kubectl create secret generic ai-agent-secrets -n ai-agent \
#     --from-literal=BRAVE_API_KEY=<key> \
#     --from-literal=QDRANT_API_KEY=<key>
webSearch:
  provider: "none"
  searxngUrl: "http://searxng.searxng.svc.cluster.local:8080"
  secretName: "ai-agent-secrets"  # K8s secret containing the provider API key

# ── Reranker ─────────────────────────────────────────────────────────────────
# Leave url empty to disable reranking (top-5 by vector score is used instead).
# Deploy ai-stack/charts/reranker first, then set url here to enable it.
reranker:
  url: ""  # e.g. http://reranker.reranker.svc.cluster.local:8003