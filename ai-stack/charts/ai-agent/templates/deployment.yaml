apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: ai-agent
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
      annotations:
        # Prometheus annotation-based discovery scrapes /metrics on the container port.
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ai-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8000
          env:
            - name: VLLM_BASE_URL
              value: {{ .Values.vllm.baseUrl | quote }}
            - name: VLLM_MODEL
              value: {{ .Values.vllm.model | quote }}
            # API key for the OpenAI-compatible endpoint. optional:true — the bundled
            # local vLLM needs none; add a VLLM_API_KEY key to the secret only when
            # vllm.baseUrl points at a hosted endpoint that requires auth.
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: VLLM_API_KEY
                  optional: true
            - name: WEB_SEARCH_PROVIDER
              value: {{ .Values.webSearch.provider | quote }}
            {{- if eq .Values.webSearch.provider "searxng" }}
            - name: SEARXNG_URL
              value: {{ .Values.webSearch.searxngUrl | quote }}
            {{- else if eq .Values.webSearch.provider "brave" }}
            - name: BRAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webSearch.secretName }}
                  key: BRAVE_API_KEY
            {{- else if eq .Values.webSearch.provider "serper" }}
            - name: SERPER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webSearch.secretName }}
                  key: SERPER_API_KEY
            {{- else if eq .Values.webSearch.provider "tavily" }}
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.webSearch.secretName }}
                  key: TAVILY_API_KEY
            {{- end }}
            - name: QDRANT_URL
              value: {{ .Values.qdrant.url | quote }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qdrant.secretName }}
                  key: QDRANT_API_KEY
            - name: EMBEDDING_URL
              value: {{ .Values.embedding.url | quote }}
            - name: INGESTION_URL
              value: {{ .Values.ingestion.url | quote }}
            - name: INGESTION_PUBLIC_URL
              value: {{ .Values.ingestion.publicUrl | default "" | quote }}
            - name: CITE_VERIFY
              value: {{ .Values.citeVerify | default "true" | quote }}
            - name: QUERY_REWRITE
              value: {{ .Values.queryRewrite | default "false" | quote }}
            - name: RERANKER_URL
              value: {{ .Values.reranker.url | quote }}
            - name: ENVIRONMENT
              value: {{ if .Values.config.production }}"production"{{ else }}"development"{{ end }}
            - name: ALLOW_ANONYMOUS
              value: {{ .Values.config.allowAnonymous | toString | quote }}
            # Shared data-plane token. optional:true so anonymous/trusted-LAN deploys (no token
            # in the secret) still boot; the service decides whether to enforce.
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: SERVICE_TOKEN
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
              cpu: {{ .Values.resources.requests.cpu }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
              cpu: {{ .Values.resources.limits.cpu }}