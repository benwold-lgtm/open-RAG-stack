[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-auth"
version = "0.1.0"
description = "Shared authentication/authorization framework for the open-RAG-stack services (scopes + composite OIDC/local auth + break-glass)."
requires-python = ">=3.11"
dependencies = [
    "PyJWT[crypto]>=2.8,<3",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "fastapi>=0.111"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_auth*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
