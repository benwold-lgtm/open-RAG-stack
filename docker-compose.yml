# Open-RAG-Stack — single-node docker compose for Phase 5 testing
#
# Requirements:
#   - Docker Engine with NVIDIA Container Toolkit installed
#     https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   - GPU: any CUDA-capable GPU (RTX 3090 for testing, L40S for production)
#
# Quickstart:
#   cp .env.example .env          # fill in MODEL_DIR and LLM_MODEL
#   docker compose pull           # pull all images (internet required once)
#   docker compose up -d

name: open-rag-stack

services:

  # ── Vector store ──────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    restart: unless-stopped
    # RocksDB opens many .sst segment files; the default soft nofile limit
    # (1024) is exhausted as collections grow, which wedges the HTTP API with
    # "Too many open files (os error 24)". Raise it well above the segment count.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Embedding service ─────────────────────────────────────────────────────────
  embedding:
    image: ghcr.io/benwold-lgtm/open-rag-embedding:latest
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL: nomic-ai/nomic-embed-text-v1.5
      HF_HOME: /models/huggingface
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  # ── Reranker service ──────────────────────────────────────────────────────────
  reranker:
    image: ghcr.io/benwold-lgtm/open-rag-reranker:latest
    restart: unless-stopped
    environment:
      RERANKER_MODEL: BAAI/bge-reranker-v2-m3
      HF_HOME: /models/huggingface
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    ports:
      - "8003:8003"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8003/health\")'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s

  # ── Ingestion service ─────────────────────────────────────────────────────────
  # user: root — testing-only override to ensure the named volume at /app/data is
  # writable. The K8s deployment handles this via podSecurityContext.fsGroup: 1000.
  ingestion:
    image: ghcr.io/benwold-lgtm/open-rag-ingestion:latest
    restart: unless-stopped
    user: "0:0"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      EMBEDDING_URL: http://embedding:8001
      DB_PATH: /app/data/ingestion.db
      # 256 validated best in Phase 6 (page-level hit@5 0.820 vs 0.770 at 512).
      CHUNK_SIZE: ${CHUNK_SIZE:-256}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-64}
      EMBEDDING_DIM: "768"
      OCR_ENABLED: "true"
      OCR_MIN_CHARS: "100"
      OCR_DPI: "200"
      # Drop folder (bulk auto-ingest). Off unless WATCH_DIR is set to /mnt/watch.
      # Files in <WATCH_HOST_DIR>/<vendor>/ are auto-ingested; subfolder = collection+vendor.
      WATCH_DIR: ${WATCH_DIR:-}
      WATCH_POLL_INTERVAL: ${WATCH_POLL_INTERVAL:-60}
    volumes:
      - ingestion_data:/app/data
      - ${MODEL_DIR:-./models}:/models:ro
      - ${WATCH_HOST_DIR:-./rag-watch}:/mnt/watch
    ports:
      - "8002:8002"
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\")'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── LLM inference (vLLM) ──────────────────────────────────────────────────────
  # Model must be pre-downloaded to ${MODEL_DIR}/huggingface/ before starting.
  # vLLM takes 2-5 minutes to load depending on model size — ai-agent will retry.
  vllm:
    image: vllm/vllm-openai:v0.9.2
    restart: unless-stopped
    command:
      - "--model"
      - "${LLM_MODEL}"
      - "--download-dir"
      - "/models/huggingface/hub"
      - "--max-model-len"
      - "8192"
      # Default 0.70 leaves room for embedding + reranker on the same GPU.
      # Bump toward 0.90 on a dedicated/larger card (e.g. L40S) via VLLM_GPU_UTIL in .env.
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_UTIL:-0.70}"
      - "--max-num-seqs"
      - "4"
    environment:
      HF_HOME: /models/huggingface
    volumes:
      - ${MODEL_DIR:-./models}:/models
      - vllm_cache:/data
    ports:
      - "8000:8000"
    shm_size: "16g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    networks: [rag-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s

  # ── RAG agent ─────────────────────────────────────────────────────────────────
  # Exposed on host port 8004 (vLLM owns 8000; ai-agent runs on 8000 internally).
  # chat-ui talks to this via http://ai-agent:8000/v1 (internal network name).
  ai-agent:
    image: ghcr.io/benwold-lgtm/open-rag-ai-agent:latest
    restart: unless-stopped
    environment:
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: ${LLM_MODEL}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      EMBEDDING_URL: http://embedding:8001
      RERANKER_URL: http://reranker:8003
      INGESTION_URL: http://ingestion:8002
      # Browser-reachable base for inline page-image citations (set in .env, e.g.
      # http://<host-ip>:8002). Empty = text-only page citations.
      INGESTION_PUBLIC_URL: ${INGESTION_PUBLIC_URL:-}
      # Verified citations: model emits verbatim quotes, agent checks them against
      # retrieved chunks and flags unverified ones. Set "false" to disable.
      CITE_VERIFY: "true"
      # Query rewriting before retrieval. Off by default — Phase 5 found it
      # net-negative for dense retrieval with nomic. Set "true" to re-enable.
      QUERY_REWRITE: ${QUERY_REWRITE:-false}
      WEB_SEARCH_PROVIDER: "none"
    ports:
      - "8004:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      reranker:
        condition: service_healthy
      vllm:
        condition: service_healthy
    networks: [rag-net]

  # ── RAG admin UI ─────────────────────────────────────────────────────────────
  # Internal admin page. Optional HTTP Basic Auth: set ADMIN_USER + ADMIN_PASSWORD
  # (e.g. in .env) to require a login; leave them blank for no auth (default).
  # Either way, keep network access LAN-scoped (firewall / VLAN). http://<host-ip>:8005
  rag-admin:
    image: ghcr.io/benwold-lgtm/open-rag-admin:latest
    restart: unless-stopped
    environment:
      INGESTION_URL: http://ingestion:8002
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8005:8005"
    depends_on:
      ingestion:
        condition: service_healthy
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8005/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Web search — optional ─────────────────────────────────────────────────────
  # Disabled by default (ai-agent WEB_SEARCH_PROVIDER: none).
  # To enable: set WEB_SEARCH_PROVIDER: searxng in ai-agent env above,
  # then update docker-compose/searxng/settings.yml with a real secret_key.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./docker-compose/searxng:/etc/searxng:ro
    ports:
      - "8080:8080"
    networks: [rag-net]

  # ── Chat UI (first-party multi-user) ──────────────────────────────────────────
  # Multi-user chat with local + OIDC sign-in, per-user conversations, and answers
  # with page-level citations. Access at http://<host-ip>:3001
  # Build context is the REPO ROOT so the image can bundle the shared rag_auth module.
  chat-ui:
    image: ghcr.io/benwold-lgtm/open-rag-chat-ui:latest
    build:
      context: .
      dockerfile: ai-stack/services/chat-ui/Dockerfile
    restart: unless-stopped
    environment:
      CHAT_UI_DB: /data/chat_ui.db
      AI_AGENT_URL: http://ai-agent:8000/v1
      # development = relaxed boot for single-node testing. Set CHAT_ENV=production (and a
      # SESSION_SECRET below) for any real / multi-user deployment — boot then fails closed.
      ENVIRONMENT: ${CHAT_ENV:-development}
      # Set a stable secret so sessions survive restarts (required when ENVIRONMENT=production).
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Plain HTTP on the LAN → cookies cannot be Secure. Set true only behind TLS.
      COOKIE_SECURE: "false"
      LOCAL_LOGIN_ENABLED: "true"
      REGISTRATION_ENABLED: "true"
      REQUIRE_APPROVAL: "true"
      BRAND_NAME: ${BRAND_NAME:-Open RAG Chat}
      BRAND_PRIMARY_COLOR: "${BRAND_PRIMARY_COLOR:-#2563eb}"
      # ── OIDC SSO (optional) — set OIDC_ENABLED=true and fill these in .env ──
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_GROUP_ROLES: ${OIDC_GROUP_ROLES:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      # ── Break-glass admin (optional) ──
      BREAK_GLASS_ADMIN_USER: ${BREAK_GLASS_ADMIN_USER:-}
      BREAK_GLASS_ADMIN_PASSWORD: ${BREAK_GLASS_ADMIN_PASSWORD:-}
    volumes:
      - chat_ui_data:/data
    ports:
      - "3001:8006"
    depends_on:
      - ai-agent
    networks: [rag-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8006/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  rag-net:
    driver: bridge

volumes:
  qdrant_data:
  ingestion_data:
  vllm_cache:
  chat_ui_data:
