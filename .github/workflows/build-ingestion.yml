name: Build Ingestion Service

on:
  push:
    branches:
      - main
    paths:
      # The image bundles the shared rag_auth module, so rebuild on either path.
      - 'ai-stack/services/ingestion/**'
      - 'ai-stack/lib/rag_auth/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/open-rag-ingestion

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # upload Trivy SARIF to code scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          # Build context is the REPO ROOT so the Dockerfile can COPY ai-stack/lib/rag_auth.
          context: .
          file: ai-stack/services/ingestion/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan image and publish SBOM
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          category: ${{ env.IMAGE_NAME }}
          sbom-name: sbom-ingestion
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}